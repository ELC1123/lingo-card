## Application configuration for local development
## WARNING: Do not store production credentials in this file. Prefer environment variables
spring.application.name=backend

# Database connection (supports environment overrides via ${...})
# Example: set DB_URL, DB_USERNAME, DB_PASSWORD in your environment for production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lingocard_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password123}

# JPA/Hibernate
# 'create' drops and recreates the schema on every startup — use only for local/dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
